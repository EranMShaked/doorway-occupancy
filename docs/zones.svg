<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="300" fill="#F6F7F9"/>
  <text x="30" y="38" font-size="15" font-weight="600" fill="#1F2A35">One camera frame, split in two</text>
  <text x="30" y="57" font-size="12.5" fill="#61707E">Direction comes from which way the person crosses the boundary.</text>

  <rect x="30" y="76" width="272" height="194" fill="#F5E3D0" stroke="#C2743A" stroke-width="1.5"/>
  <rect x="302" y="76" width="168" height="194" fill="#D8E5F3" stroke="#3A6FA8" stroke-width="1.5"/>
  <text x="42" y="96" font-size="12" font-weight="600" fill="#A85F2A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">doorway</text>
  <text x="314" y="96" font-size="12" font-weight="600" fill="#2F5D91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">approach</text>
  <text x="42" y="112" font-size="11" fill="#8A6A4C">the door itself</text>
  <text x="314" y="112" font-size="11" fill="#5B7898">hallway / path up to it</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A35"/>
    </marker>
  </defs>

  <g stroke="#1F2A35" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="440" y1="150" x2="70" y2="150"/>
    <line x1="70" y1="192" x2="440" y2="192"/>
    <path d="M 150 228 L 420 228"/>
    <path d="M 420 246 L 150 246"/>
  </g>

  <g font-size="13" fill="#1F2A35">
    <text x="496" y="147"><tspan font-weight="700" font-family="ui-monospace, monospace">+1</tspan><tspan dx="10" fill="#61707E">came in</tspan></text>
    <text x="496" y="189"><tspan font-weight="700" font-family="ui-monospace, monospace">−1</tspan><tspan dx="10" fill="#61707E">went out</tspan></text>
    <text x="496" y="238"><tspan font-weight="700" font-family="ui-monospace, monospace">0</tspan><tspan dx="10" fill="#61707E">knocked, left</tspan></text>
    <text x="510" y="256" font-size="11.5" fill="#8A94A0">delivery, or a</text>
    <text x="510" y="271" font-size="11.5" fill="#8A94A0">visitor who gave up</text>
  </g>

  <line x1="302" y1="76" x2="302" y2="270" stroke="#1F2A35" stroke-width="1" stroke-dasharray="4 4" opacity="0.45"/>
  <text x="30" y="288" font-size="11" fill="#8A94A0" font-family="ui-monospace, monospace">zone membership uses the bounding box bottom-centre point, so only floor level matters</text>
</svg>
