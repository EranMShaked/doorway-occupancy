<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="760" height="300" fill="#F6F7F9"/>
  <text x="28" y="34" font-size="15" font-weight="600" fill="#1F2A35">From a track to a number</text>
  <text x="28" y="53" font-size="12.5" fill="#61707E">A real recorded event, at each stage of the classifier.</text>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A94A0"/>
    </marker>
  </defs>

  <g font-size="11" font-weight="600" fill="#8A94A0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="28" y="88">1. BOTTOM-CENTRE X</text>
    <text x="28" y="140">2. ZONE PER POINT</text>
    <text x="28" y="192">3. COLLAPSE REPEATS</text>
    <text x="28" y="244">4. SUM TRANSITIONS</text>
  </g>

  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1F2A35">
    <text x="250" y="88">0.83     0.71     0.52     0.42</text>
  </g>

  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="250" y="140" fill="#2F5D91">approach approach</text>
    <text x="466" y="140" fill="#A85F2A">doorway  doorway</text>
  </g>

  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="250" y="192" fill="#2F5D91">approach</text>
    <text x="350" y="192" fill="#8A94A0">-&gt;</text>
    <text x="382" y="192" fill="#A85F2A">doorway</text>
  </g>

  <g font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="250" y="244" fill="#1F2A35">+1</text>
    <text x="288" y="244" fill="#61707E" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5">came in. Count goes up by one.</text>
  </g>

  <g stroke="#8A94A0" stroke-width="1.3" marker-end="url(#c)" opacity="0.8">
    <line x1="150" y1="98" x2="150" y2="126"/>
    <line x1="150" y1="150" x2="150" y2="178"/>
    <line x1="150" y1="202" x2="150" y2="230"/>
  </g>

  <line x1="28" y1="266" x2="732" y2="266" stroke="#D5DBE2" stroke-width="1"/>
  <text x="28" y="286" font-size="11.5" fill="#8A94A0">Every timeline entry is used, not just the zone crossings. A track that starts inside a zone never logs a crossing.</text>
</svg>
